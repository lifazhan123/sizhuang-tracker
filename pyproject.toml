[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sizhuang-tracker"
version = "1.0.0"
description = "合众思壮(002383) 个股观察：行情/资金/新闻/公告/股吧抓取 + 每日邮件推送"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sizhuang = "sizhuang.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
