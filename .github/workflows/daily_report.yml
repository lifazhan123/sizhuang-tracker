name: 每日个股观察报告

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间。
    # UTC 04:00 = 北京时间 12:00（UTC+8）。
    - cron: "0 4 * * *"
  # 支持手动触发，便于测试与补发
  workflow_dispatch:
    inputs:
      no_mail:
        description: "只生成报告，不发送邮件"
        type: boolean
        default: false

# 同一时间只跑一个实例，避免重复发信
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    name: 抓取数据并推送邮件
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成并发送报告
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          # ---- SMTP 配置：在仓库 Settings → Secrets and variables → Actions 中配置 ----
          SZ_SMTP_HOST: ${{ secrets.SZ_SMTP_HOST }}
          SZ_SMTP_PORT: ${{ secrets.SZ_SMTP_PORT }}
          SZ_SMTP_USER: ${{ secrets.SZ_SMTP_USER }}
          SZ_SMTP_PASSWORD: ${{ secrets.SZ_SMTP_PASSWORD }}
          SZ_MAIL_FROM: ${{ secrets.SZ_MAIL_FROM }}
          SZ_MAIL_TO: ${{ secrets.SZ_MAIL_TO }}
          SZ_MAIL_ENABLED: ${{ secrets.SZ_MAIL_ENABLED || 'true' }}
        run: |
          if [ "${{ github.event.inputs.no_mail }}" = "true" ]; then
            python -m sizhuang.cli run --no-mail --json --preview
          else
            python -m sizhuang.cli run --json
          fi

      - name: 上传报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn
