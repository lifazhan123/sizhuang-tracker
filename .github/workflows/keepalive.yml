name: 保活（防止定时任务被自动禁用）

# GitHub 会在仓库连续 60 天无活动时自动禁用定时工作流。
# 本工作流每月第 1 天写入一次时间戳，让仓库保持“活跃”，
# 确保 daily_report.yml 的定时任务不会被停用。
#
# 如果你能保证每月都会向仓库提交代码，可以删除本文件。

on:
  schedule:
    - cron: "0 3 1 * *"   # 每月 1 日 UTC 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 刷新时间戳
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ keepalive' > .github/keepalive.txt
          cat .github/keepalive.txt

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --quiet --cached || git commit -m "chore: monthly keepalive [skip ci]"
          git push
